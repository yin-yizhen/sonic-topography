[package]
name = "sonic-topography"
version = "0.2.0"
description = "Sonic Topography"
authors = ["sonic-topography"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
windows-core = "0.58"

[profile.release]
# Prefer smaller binary size for this visualization app
opt-level = "z"
# Enable full link-time optimization
lto = true
# Strip debug symbols to reduce size
strip = true
# Use abort instead of unwinding to reduce binary size
panic = "abort"
# Single codegen unit for maximum size optimization
codegen-units = 1
